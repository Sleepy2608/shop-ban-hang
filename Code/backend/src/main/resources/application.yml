spring:
  application:
    name: ecommerce

  # =================== DATABASE ===================
  datasource:
    url: jdbc:mysql://localhost:3306/shop_ban_hang?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: your_password_here   # <-- Đổi thành mật khẩu MySQL của bạn
    driver-class-name: com.mysql.cj.jdbc.Driver

  # =================== JPA / HIBERNATE ===================
  jpa:
    hibernate:
      ddl-auto: validate           # validate: chỉ kiểm tra, KHÔNG tự tạo/xóa bảng
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # =================== FILE UPLOAD ===================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# =================== SERVER ===================
server:
  port: 8080
  servlet:
    context-path: /api             # Tất cả API đều có prefix /api

# =================== JWT ===================
jwt:
  secret: your-super-secret-jwt-key-at-least-256-bits-long-change-this-in-production
  expiration: 86400000             # 24 giờ (ms)
  refresh-expiration: 604800000    # 7 ngày (ms)

# =================== CORS ===================
cors:
  allowed-origins: http://localhost:5173   # Port mặc định của Vite
